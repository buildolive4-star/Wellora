name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found on PATH."
            exit 1
          fi
          JAVA_VER_OUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUT"
          VERSION_TOKEN="$(echo "$JAVA_VER_OUT" | sed -nE 's/.*version "([^"]+)".*/\1/p' | head -n 1)"
          if [ -z "$VERSION_TOKEN" ]; then
            echo "::error::Unable to detect Java version."
            exit 1
          fi
          if echo "$VERSION_TOKEN" | grep -q '^1\.'; then
            MAJOR_VER="$(echo "$VERSION_TOKEN" | cut -d'.' -f2)"
          else
            MAJOR_VER="$(echo "$VERSION_TOKEN" | cut -d'.' -f1 | cut -d'-' -f1 | cut -d'+' -f1)"
          fi
          if ! echo "$MAJOR_VER" | grep -qE '^[0-9]+$'; then
            echo "::error::Unable to parse Java major version from '$VERSION_TOKEN'."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
              echo "::error::keytool not found in configured Java installation."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore could not be created."
            exit 1
          fi
          echo "Verified ./debug.keystore is present."

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK root: $SDK_ROOT"
          SDKMANAGER_BIN=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER_BIN="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER_BIN" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="$(command -v sdkmanager)"
          fi
          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "Found sdkmanager: $SDKMANAGER_BIN"
            yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
            yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true
            yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "build-tools;36.0.0" || true
            yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "build-tools;36.1.0" || true
          else
            echo "::warning::sdkmanager not found under $SDK_ROOT"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle_build.log"

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ] || [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::Expected debug APK not found or invalid at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "::error::Source APK missing or empty at $SRC_APK"
            exit 1
          fi
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset.XXXXXX")"
          DEST_APK="${RELEASE_DIR}/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ] || [[ "$DEST_APK" != */app-debug.apk ]]; then
            echo "::error::Failed to prepare release asset app-debug.apk"
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK does not exist or is empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]] || [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          printf -v RELEASE_NOTES '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit SHA: ${GITHUB_SHA}" \
            "- Purpose: Intended for testing only; not a Play Store production release." \
            "- Signing: Signed only with a temporary debug keystore."
          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Confirming published GitHub Release..."
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            RELEASE_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq '.name')"
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "Normal Actions artifact 'app-debug-apk' remains available as a backup."
            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** GitHub Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed (outcome: ${RELEASE_OUTCOME})."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded at app/build/outputs/apk/debug/app-debug.apk."
            fi
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "The GitHub Actions artifact 'app-debug-apk' remains available."
            fi
            {
              echo "## Debug APK Build Status"
              echo ""
              echo "⚠️ **GitHub Release publishing failed.** The new APK is not available via the direct latest-release link."
              if [ -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
                echo "- Debug APK build succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)."
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- GitHub Actions artifact \`app-debug-apk\` remains available."
              fi
              if [ -f "$RUNNER_TEMP/gradle_build.log" ]; then
                echo ""
                echo "### Build Error Summary"
                echo '```text'
                grep -nE -A 5 "FAILURE:|What went wrong:|Caused by:|> Task .* FAILED" "$RUNNER_TEMP/gradle_build.log" | head -n 60 || tail -n 50 "$RUNNER_TEMP/gradle_build.log"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
